name: Build My Voice APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk MyVoice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyVoice-apk
          path: MyVoice.apk

      - name: Publish release (direct phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: My Voice build ${{ github.run_number }}
          files: MyVoice.apk
          make_latest: true
          body: |
            Open this page on your phone and tap **MyVoice.apk** to install.
            Permanent link to the newest build: https://github.com/${{ github.repository }}/releases/latest/download/MyVoice.apk
